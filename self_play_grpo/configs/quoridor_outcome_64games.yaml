# Four rollout HPUs x 16 matches each = 64 matches per update.
# Keep the baseline quoridor_outcome.yaml unchanged for 16-match runs.
project: quoridor_self_play_grpo
seed: 11
environment:
  game: quoridor
  engine_revision: d0606878b957274cc67a918ed173b36e9fe0fed6
  players: 4
  board_size: 9
  wall_count: 5
  max_joint_actions: 120
  horizon_result: uniform_draw
  action_perspective: player_relative
model:
  id: Qwen/Qwen3-4B
  revision: 1cfa9a7208912126459214e8b04321603b3df60c
  local_path: /scratch/svijay46/models/Qwen3-4B
  local_files_only: true
  enable_thinking: false
  device: hpu
  dtype: bfloat16
  lora_rank: 16
  lora_alpha: 32
  dropout: 0.0
rollout:
  games_per_update: 64
  parallel_games_per_rank: 2
  shared_weights_across_seats: true
  max_new_tokens: 16
  temperature: 1.0
  top_p: 1.0
  top_k: 0
