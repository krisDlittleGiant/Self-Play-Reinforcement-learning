  clip_epsilon: 0.2
  optimizer_epochs_per_batch: 1
  max_grad_norm: 1.0
  kl_beta: 0.0
  loss_normalizer_per_game: 120
process_extension:
  enabled: false
  proxy_temperature: 2.0
  shaping_alpha: 1.0
  gamma: 1.0
  gae_lambda: 0.95
  process_blend_eta: 0.25
evaluation:
  fixed_opponent_manifest: null
  rotate_candidate_through_all_seats: true
  training_seeds: [11, 22, 33]
