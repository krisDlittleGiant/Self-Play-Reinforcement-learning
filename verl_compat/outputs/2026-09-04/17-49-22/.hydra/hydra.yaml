hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath:
  - file://verl/trainer/config
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - algorithm.adv_estimator=grpo
    - algorithm.use_kl_in_reward=False
    - data.train_files=/scratch/svijay46/data/gsm8k_verl/train.parquet
    - data.val_files=/scratch/svijay46/data/gsm8k_verl/test.parquet
    - data.prompt_key=prompt
    - data.train_batch_size=32
    - data.max_prompt_length=512
    - data.max_response_length=2048
    - data.filter_overlong_prompts=True
    - data.truncation=error
    - data.dataloader_num_workers=0
    - actor_rollout_ref.model.path=/scratch/svijay46/models/Qwen3-0.6B
    - actor_rollout_ref.model.enable_gradient_checkpointing=True
    - actor_rollout_ref.actor.optim.lr=1e-6
    - actor_rollout_ref.actor.ppo_mini_batch_size=8
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=2
    - actor_rollout_ref.actor.use_kl_loss=False
    - actor_rollout_ref.actor.kl_loss_coef=0.001
    - actor_rollout_ref.actor.kl_loss_type=low_var_kl
    - actor_rollout_ref.actor.entropy_coeff=0
    - actor_rollout_ref.rollout.name=sglang
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.5
    - actor_rollout_ref.rollout.n=8
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=2
    - actor_rollout_ref.model.use_remove_padding=False
    - actor_rollout_ref.actor.use_remove_padding=False
    - actor_rollout_ref.actor.use_dynamic_bsz=False
    - actor_rollout_ref.rollout.log_prob_use_dynamic_bsz=False
    - actor_rollout_ref.ref.log_prob_use_dynamic_bsz=False
    - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=2
    - actor_rollout_ref.actor.fsdp_config.model_dtype=float32
    - actor_rollout_ref.rollout.dtype=bfloat16
    - actor_rollout_ref.actor.fsdp_config.reshard_after_forward=False
    - actor_rollout_ref.ref.fsdp_config.reshard_after_forward=False
    - actor_rollout_ref.actor.fsdp_config.param_offload=False
    - actor_rollout_ref.actor.fsdp_config.optimizer_offload=False
    - actor_rollout_ref.ref.fsdp_config.param_offload=False
    - actor_rollout_ref.rollout.free_cache_engine=False
    - actor_rollout_ref.rollout.checkpoint_engine.update_weights_bucket_megabytes=128
    - ++actor_rollout_ref.model.override_config.attn_implementation=eager
    - trainer.critic_warmup=0
    - trainer.logger=["console"]
    - trainer.project_name=verl_grpo_gsm8k_gaudi
    - trainer.experiment_name=Qwen3-0.6B_gsm8k_grpo_hpu
    - trainer.n_gpus_per_node=4
    - trainer.nnodes=1
    - trainer.val_before_train=False
    - trainer.save_freq=-1
    - trainer.test_freq=-1
    - trainer.total_epochs=1
    - trainer.total_training_steps=1
    - trainer.default_local_dir=/scratch/svijay46/checkpoints/verl_grpo_gsm8k_gaudi/Qwen3-0.6B_gsm8k_grpo_hpu
    - +ray_kwargs.ray_init.address=127.0.0.1:6381
  job:
    name: main_sppo
    chdir: null
    override_dirname: ++actor_rollout_ref.model.override_config.attn_implementation=eager,+ray_kwargs.ray_init.address=127.0.0.1:6381,actor_rollout_ref.actor.entropy_coeff=0,actor_rollout_ref.actor.fsdp_config.model_dtype=float32,actor_rollout_ref.actor.fsdp_config.optimizer_offload=False,actor_rollout_ref.actor.fsdp_config.param_offload=False,actor_rollout_ref.actor.fsdp_config.reshard_after_forward=False,actor_rollout_ref.actor.kl_loss_coef=0.001,actor_rollout_ref.actor.kl_loss_type=low_var_kl,actor_rollout_ref.actor.optim.lr=1e-6,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=2,actor_rollout_ref.actor.ppo_mini_batch_size=8,actor_rollout_ref.actor.use_dynamic_bsz=False,actor_rollout_ref.actor.use_kl_loss=False,actor_rollout_ref.actor.use_remove_padding=False,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.path=/scratch/svijay46/models/Qwen3-0.6B,actor_rollout_ref.model.use_remove_padding=False,actor_rollout_ref.ref.fsdp_config.param_offload=False,actor_rollout_ref.ref.fsdp_config.reshard_after_forward=False,actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=2,actor_rollout_ref.ref.log_prob_use_dynamic_bsz=False,actor_rollout_ref.rollout.checkpoint_engine.update_weights_bucket_megabytes=128,actor_rollout_ref.rollout.dtype=bfloat16,actor_rollout_ref.rollout.free_cache_engine=False,actor_rollout_ref.rollout.gpu_memory_utilization=0.5,actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=2,actor_rollout_ref.rollout.log_prob_use_dynamic_bsz=False,actor_rollout_ref.rollout.n=8,actor_rollout_ref.rollout.name=sglang,actor_rollout_ref.rollout.tensor_model_parallel_size=1,algorithm.adv_estimator=grpo,algorithm.use_kl_in_reward=False,data.dataloader_num_workers=0,data.filter_overlong_prompts=True,data.max_prompt_length=512,data.max_response_length=2048,data.prompt_key=prompt,data.train_batch_size=32,data.train_files=/scratch/svijay46/data/gsm8k_verl/train.parquet,data.truncation=error,data.val_files=/scratch/svijay46/data/gsm8k_verl/test.parquet,trainer.critic_warmup=0,trainer.default_local_dir=/scratch/svijay46/checkpoints/verl_grpo_gsm8k_gaudi/Qwen3-0.6B_gsm8k_grpo_hpu,trainer.experiment_name=Qwen3-0.6B_gsm8k_grpo_hpu,trainer.logger=["console"],trainer.n_gpus_per_node=4,trainer.nnodes=1,trainer.project_name=verl_grpo_gsm8k_gaudi,trainer.save_freq=-1,trainer.test_freq=-1,trainer.total_epochs=1,trainer.total_training_steps=1,trainer.val_before_train=False
    id: ???
    num: ???
    config_name: sppo_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.6
    version_base: '1.3'
    cwd: /scratch/svijay46/verl-gaudi-support/verl_compat
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /scratch/svijay46/verl-gaudi-support/verl_compat/recipe/sppo/config
      schema: file
      provider: main
    - path: verl/trainer/config
      schema: file
      provider: hydra.searchpath in main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /scratch/svijay46/verl-gaudi-support/verl_compat/outputs/2026-09-04/17-49-22
    choices:
      distillation: distillation
      algorithm@algorithm.rollout_correction: rollout_correction
      reward: reward
      model@critic.model: hf_model
      model@actor_rollout_ref.model: hf_model
      rollout@actor_rollout_ref.rollout: rollout
      data: legacy_data
      model_engine: dp
      critic: dp_critic
      critic/../engine@critic.fsdp: fsdp
      critic/../optim@critic.optim: fsdp
      ref@actor_rollout_ref.ref: dp_ref
      ref/../engine@actor_rollout_ref.ref.fsdp_config: fsdp
      actor@actor_rollout_ref.actor: dp_actor
      actor/../engine@actor_rollout_ref.actor.fsdp_config: fsdp
      actor/../optim@actor_rollout_ref.actor.optim: fsdp
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
